<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f1e8" />

    <title>Nasze wspólne wspomnienia — Urodziny Mamy</title>

    <link rel="stylesheet" href="../../styles.css" />

    <style>
      .memories-page {
        width: min(100%, 900px);
        overflow: hidden;
      }

      .memory-slider {
        margin-top: 2rem;
      }

      .memory-stage {
        position: relative;
        height: clamp(340px, 65vw, 570px);
        overflow: hidden;
        border: 1px solid rgba(103, 44, 60, 0.15);
        border-radius: 1.4rem;
        background: #4e3138;
        box-shadow: 0 22px 55px rgba(78, 49, 45, 0.2);
        touch-action: pan-y;
      }

      .memory-slide {
        position: absolute;
        inset: 0;
        z-index: 0;
        margin: 0;
        opacity: 0;
        transform: scale(1.04);
        transition:
          opacity 0.65s ease,
          transform 0.8s ease;
        pointer-events: none;
      }

      .memory-slide.is-active {
        z-index: 1;
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }

      .memory-backdrop {
        position: absolute;
        inset: -8%;
        width: 116%;
        height: 116%;
        object-fit: cover;
        filter: blur(28px);
        opacity: 0.42;
        transform: scale(1.1);
      }

      .memory-photo {
        position: absolute;
        top: 50%;
        left: 50%;
        display: block;
        width: auto;
        height: auto;
        max-width: 88%;
        max-height: 88%;
        object-fit: contain;
        border: 7px solid rgba(255, 255, 255, 0.95);
        border-radius: 0.7rem;
        box-shadow: 0 18px 45px rgba(30, 15, 20, 0.35);
        transform: translate(-50%, -47%) scale(0.96);
        transition: transform 0.8s ease;
      }

      .memory-slide.is-active .memory-photo {
        transform: translate(-50%, -50%) scale(1);
      }

      .slider-button {
        position: absolute;
        top: 50%;
        z-index: 3;
        display: grid;
        width: 46px;
        height: 46px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.82);
        color: #672c3c;
        font-size: 1.6rem;
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(30, 15, 20, 0.2);
        transform: translateY(-50%);
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .slider-button:hover {
        background: #fff;
        transform: translateY(-50%) scale(1.08);
      }

      .slider-button.previous {
        left: 1rem;
      }

      .slider-button.next {
        right: 1rem;
      }

      .memory-counter {
        position: absolute;
        right: 1rem;
        bottom: 1rem;
        z-index: 3;
        padding: 0.4rem 0.75rem;
        border-radius: 2rem;
        background: rgba(40, 20, 27, 0.7);
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
      }

      .memory-dots {
        display: flex;
        justify-content: center;
        gap: 0.6rem;
        margin-top: 1.2rem;
      }

      .memory-dot {
        width: 9px;
        height: 9px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(103, 44, 60, 0.25);
        cursor: pointer;
        transition:
          width 0.25s ease,
          background 0.25s ease;
      }

      .memory-dot.is-active {
        width: 28px;
        border-radius: 1rem;
        background: var(--rose);
      }

      @media (max-width: 600px) {
        .memories-page {
          padding-inline: 1rem;
        }

        .memory-stage {
          height: 470px;
        }

        .memory-photo {
          max-width: 87%;
          max-height: 86%;
          border-width: 5px;
        }

        .slider-button {
          width: 40px;
          height: 40px;
        }

        .slider-button.previous {
          left: 0.5rem;
        }

        .slider-button.next {
          right: 0.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .memory-slide,
        .memory-photo {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="gift-shell">
      <a class="back-link" href="../../">
        <span aria-hidden="true">←</span>
        Wróć do niespodzianek
      </a>

      <article class="gift-paper memories-page">
        <p class="gift-number">Niespodzianka 03</p>

        <h1>Nasze wspólne wspomnienia</h1>

        <section
          class="memory-slider"
          aria-label="Galeria wspólnych zdjęć"
          tabindex="0"
        >
          <div class="memory-stage">
            <figure class="memory-slide is-active">
              <img class="memory-backdrop" src="11.jpeg" alt="" />
              <img class="memory-photo" src="11.jpeg" alt="Wspólne wspomnienie 1" />
            </figure>

            <figure class="memory-slide">
              <img class="memory-backdrop" src="12.jpeg" alt="" />
              <img class="memory-photo" src="12.jpeg" alt="Wspólne wspomnienie 2" />
            </figure>

            <figure class="memory-slide">
              <img class="memory-backdrop" src="13.jpeg" alt="" />
              <img class="memory-photo" src="13.jpeg" alt="Wspólne wspomnienie 3" />
            </figure>

            <figure class="memory-slide">
              <img class="memory-backdrop" src="14.jpeg" alt="" />
              <img class="memory-photo" src="14.jpeg" alt="Wspólne wspomnienie 4" />
            </figure>

            <figure class="memory-slide">
              <img class="memory-backdrop" src="15.jpeg" alt="" />
              <img class="memory-photo" src="15.jpeg" alt="Wspólne wspomnienie 5" />
            </figure>

            <button
              class="slider-button previous"
              type="button"
              aria-label="Poprzednie zdjęcie"
            >
              ‹
            </button>

            <button
              class="slider-button next"
              type="button"
              aria-label="Następne zdjęcie"
            >
              ›
            </button>

            <div class="memory-counter">
              <span class="current-slide">01</span> / 05
            </div>
          </div>

          <div class="memory-dots" aria-label="Wybór zdjęcia">
            <button class="memory-dot is-active" type="button" aria-label="Zdjęcie 1"></button>
            <button class="memory-dot" type="button" aria-label="Zdjęcie 2"></button>
            <button class="memory-dot" type="button" aria-label="Zdjęcie 3"></button>
            <button class="memory-dot" type="button" aria-label="Zdjęcie 4"></button>
            <button class="memory-dot" type="button" aria-label="Zdjęcie 5"></button>
          </div>
        </section>
        <section class="family-reveal" aria-label="Odkrywanie rodzinnego portretu">
  <div class="family-stage">
    <!-- Kolorowy obraz znajdujący się pod wszystkimi warstwami -->
    <img
      class="family-base"
      src="rodzinny-portret.png"
      alt="Rodzinny portret z Mamą pośrodku"
    />

    <!-- Wyszarzona warstwa Krzyśka -->
    <button
      class="family-layer layer-krzysiek"
      type="button"
      data-person="krzysiek"
      aria-label="Odkryj Krzyśka"
      aria-pressed="false"
    >
      <img src="rodzinny-portret.png" alt="" />
    </button>

    <!-- Wyszarzona warstwa Kitka -->
    <button
      class="family-layer layer-kitek"
      type="button"
      data-person="kitek"
      aria-label="Odkryj Kitka"
      aria-pressed="false"
    >
      <img src="rodzinny-portret.png" alt="" />
    </button>

    <!-- Wyszarzona warstwa Tosi -->
    <button
      class="family-layer layer-tosia"
      type="button"
      data-person="tosia"
      aria-label="Odkryj Tosię"
      aria-pressed="false"
    >
      <img src="rodzinny-portret.png" alt="" />
    </button>

    <!-- Wyszarzona warstwa Kuby -->
    <button
      class="family-layer layer-kuba"
      type="button"
      data-person="kuba"
      aria-label="Odkryj Kubę"
      aria-pressed="false"
    >
      <img src="rodzinny-portret.png" alt="" />
    </button>

    <!-- Wyszarzona warstwa Julii -->
    <button
      class="family-layer layer-julia"
      type="button"
      data-person="julia"
      aria-label="Odkryj Julię"
      aria-pressed="false"
    >
      <img src="rodzinny-portret.png" alt="" />
    </button>

    <div class="family-counter">
      <span id="familyRevealCount">0</span>/5
    </div>
  </div>

  <p
    class="family-final-message"
    id="familyFinalMessage"
    aria-live="polite"
  >
    To AI. Teraz czas zrobić je w rzeczywistości.
  </p>
</section>
      </article>
    </main>

    <script>
      const slider = document.querySelector(".memory-slider");
      const stage = document.querySelector(".memory-stage");
      const slides = [...document.querySelectorAll(".memory-slide")];
      const dots = [...document.querySelectorAll(".memory-dot")];
      const counter = document.querySelector(".current-slide");

      let currentSlide = 0;
      let touchStartX = 0;

      function showSlide(number) {
        currentSlide = (number + slides.length) % slides.length;

        slides.forEach((slide, index) => {
          slide.classList.toggle("is-active", index === currentSlide);
        });

        dots.forEach((dot, index) => {
          dot.classList.toggle("is-active", index === currentSlide);
        });

        counter.textContent = String(currentSlide + 1).padStart(2, "0");
      }

      document
        .querySelector(".slider-button.next")
        .addEventListener("click", () => showSlide(currentSlide + 1));

      document
        .querySelector(".slider-button.previous")
        .addEventListener("click", () => showSlide(currentSlide - 1));

      dots.forEach((dot, index) => {
        dot.addEventListener("click", () => showSlide(index));
      });

      slider.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
          showSlide(currentSlide + 1);
        }

        if (event.key === "ArrowLeft") {
          showSlide(currentSlide - 1);
        }
      });

      stage.addEventListener(
        "touchstart",
        (event) => {
          touchStartX = event.changedTouches[0].clientX;
        },
        { passive: true }
      );

      stage.addEventListener(
        "touchend",
        (event) => {
          const difference = touchStartX - event.changedTouches[0].clientX;

          if (Math.abs(difference) < 50) return;

          if (difference > 0) {
            showSlide(currentSlide + 1);
          } else {
            showSlide(currentSlide - 1);
          }
        },
        { passive: true }
      );
    </script>
  </body>
</html>
